# Repository-owned SAST rules (Tier 1). Changes need security review (CODEOWNERS).
rules:
  - id: lab.python.command-injection.os-shell
    languages: [python]
    severity: ERROR
    message: >-
      Shell command built from non-literal input ($X). Use subprocess.run([...]) with an
      argument list and validate input against an allow-list.
    metadata: {cwe: "CWE-78: OS Command Injection", owasp: "A05:2025 - Injection", confidence: HIGH}
    patterns:
      - pattern-either:
          - pattern: os.system($X)
          - pattern: os.popen($X, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)

  - id: lab.python.command-injection.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: subprocess called with shell=True and a non-literal command. Pass an argument list without shell=True.
    metadata: {cwe: "CWE-78: OS Command Injection", owasp: "A05:2025 - Injection", confidence: HIGH}
    patterns:
      - pattern: subprocess.$FN($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$FN("...", ..., shell=True, ...)

  - id: lab.python.code-injection.eval-exec
    languages: [python]
    severity: ERROR
    message: eval/exec on non-literal input allows arbitrary code execution. Parse with ast and allow-list node types.
    metadata: {cwe: "CWE-95: Eval Injection", owasp: "A05:2025 - Injection", confidence: HIGH}
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: lab.python.deserialization.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: yaml.load without SafeLoader can construct arbitrary Python objects. Use yaml.safe_load.
    metadata: {cwe: "CWE-502: Deserialization of Untrusted Data", owasp: "A08:2025 - Software or Data Integrity Failures", confidence: HIGH}
    patterns:
      - pattern-either:
          - pattern: yaml.load(...)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.full_load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
